<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Bienvenidos a la clase de español!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFDF6;
    --paper-dark:#F4EFDE;
    --rule:#C7DCEC;
    --margin:#E8697A;
    --ink:#2E2B3A;
    --ink-soft:#5B5770;
    --coral:#FF6B4A;
    --sun:#FFC93C;
    --mint:#3FBFAE;
    --violet:#8B79E8;
    --sky:#3C9EE8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper-dark);
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#26232F;
      --paper-dark:#1C1A22;
      --rule:#3A3750;
      --margin:#E8697A;
      --ink:#F1EEE2;
      --ink-soft:#C6C2D6;
    }
  }
  :root[data-theme="dark"]{
    --paper:#26232F;
    --paper-dark:#1C1A22;
    --rule:#3A3750;
    --margin:#E8697A;
    --ink:#F1EEE2;
    --ink-soft:#C6C2D6;
  }

  .app{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
  }

  /* ---------- notebook sheet ---------- */
  .sheet{
    position:relative;
    width:min(980px, 96vw);
    height:min(640px, 92vh);
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 37px, var(--rule) 38px, var(--paper) 39px),
      var(--paper);
    border-radius:14px;
    box-shadow:0 18px 40px rgba(0,0,0,.22), 0 2px 0 rgba(0,0,0,.05);
    overflow:hidden;
    display:flex;
  }
  .spiral{
    width:34px;
    flex:0 0 34px;
    background:var(--paper-dark);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-evenly;
    border-right:2px dashed rgba(0,0,0,.15);
  }
  .spiral span{
    width:14px;height:14px;border-radius:50%;
    background:var(--paper);
    border:3px solid var(--ink-soft);
    opacity:.55;
  }
  .margin-line{
    position:absolute;
    left:70px; top:0; bottom:0;
    width:2px;
    background:var(--margin);
    opacity:.35;
  }
  .page{
    position:relative;
    flex:1;
    padding:34px 40px 34px 54px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .slide{
    position:absolute;
    inset:0;
    padding:34px 40px 34px 54px;
    display:flex;
    flex-direction:column;
    opacity:0;
    transform:translateX(24px);
    transition:opacity .35s ease, transform .35s ease;
    pointer-events:none;
  }
  .slide.active{
    opacity:1;
    transform:translateX(0);
    pointer-events:auto;
  }

  h1,h2,h3{
    font-family:'Caveat',cursive;
    margin:0;
    font-weight:700;
    color:var(--ink);
    line-height:1;
  }
  .eyebrow{
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    color:var(--ink-soft);
    font-size:14px;
    letter-spacing:.02em;
    margin-bottom:4px;
  }
  p{margin:0; color:var(--ink-soft);}

  /* ---------- title slide ---------- */
  .title-slide{align-items:flex-start; justify-content:center; gap:14px;}
  .title-slide h1{font-size:clamp(38px,6vw,64px); color:var(--coral);}
  .title-slide .sub{font-size:20px; max-width:520px;}
  .title-doodle{position:absolute; right:28px; bottom:18px; width:150px; height:150px;}
  .badge-row{display:flex; gap:10px; margin-top:8px; flex-wrap:wrap;}
  .badge{
    font-family:'Quicksand'; font-weight:700; font-size:13px;
    padding:6px 14px; border-radius:999px; color:#fff;
    transform:rotate(-2deg);
  }

  /* ---------- section divider ---------- */
  .divider{align-items:center; justify-content:center; text-align:center; gap:10px;}
  .divider .num{
    font-family:'Caveat'; font-size:22px; color:var(--ink-soft);
  }
  .divider h2{font-size:clamp(34px,5.4vw,56px);}
  .divider .underline{
    width:120px; height:10px; margin-top:4px;
    background:var(--sun); border-radius:8px; opacity:.7;
    transform:rotate(-1deg);
  }
  .divider .doodle-big{width:150px; height:150px; margin-top:6px;}

  /* ---------- vocab grid ---------- */
  .vocab-head{margin-bottom:10px;}
  .vocab-head h2{font-size:30px; color:var(--violet);}
  .vocab-grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    align-content:center;
  }
  .vcard{
    position:relative;
    background:var(--paper);
    border:2.5px solid var(--ink);
    border-radius:16px;
    padding:12px 10px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    box-shadow:3px 4px 0 rgba(0,0,0,.12);
  }
  .vcard svg{width:78px; height:78px;}
  .vcard .word{
    font-family:'Quicksand'; font-weight:700; font-size:15px;
    text-align:center; line-height:1.15;
  }
  .vcard .art{
    font-family:'Quicksand'; font-weight:700; font-size:10px;
    color:#fff; padding:2px 9px; border-radius:999px;
  }
  .speak-btn{
    position:absolute; top:6px; right:6px;
    width:26px; height:26px; border-radius:50%;
    border:2px solid var(--ink); background:var(--sun);
    font-size:12px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .speak-btn:active{transform:scale(.9);}
  .bubble .speak-btn{
    position:static; width:22px; height:22px; font-size:11px;
    background:#fff; margin-left:8px; flex:0 0 auto; vertical-align:middle;
  }
  .bubble-row{display:flex; align-items:center; gap:2px;}
  .bubble.q .bubble-row, .bubble.a .bubble-row{justify-content:space-between;}

  /* ---------- Q&A ---------- */
  .qa-head{margin-bottom:6px;}
  .qa-head h2{font-size:30px; color:var(--sky);}
  .qa-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:16px;
    justify-content:center;
  }
  .qa-pair{display:flex; flex-direction:column; gap:8px;}
  .bubble{
    max-width:74%;
    padding:12px 18px;
    border-radius:18px;
    font-weight:600;
    font-size:16px;
    position:relative;
    border:2.5px solid var(--ink);
  }
  .bubble.q{
    align-self:flex-start;
    background:#FFE3B0;
    border-bottom-left-radius:4px;
  }
  .bubble.a{
    align-self:flex-end;
    background:#D6F2ED;
    border-bottom-right-radius:4px;
  }
  .who{
    font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:2px;
  }

  /* ---------- quiz / closing ---------- */
  .quiz-grid{
    flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:16px; align-content:center;
  }
  .qcard{
    background:var(--paper); border:2.5px dashed var(--ink-soft);
    border-radius:16px; padding:14px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .qcard svg{width:64px;height:64px;}
  .qcard .ask{font-family:'Caveat'; font-size:22px;}

  .end-slide{align-items:center; justify-content:center; text-align:center; gap:8px;}
  .end-slide h1{font-size:clamp(34px,5.6vw,54px); color:var(--coral);}

  /* ---------- memory game ---------- */
  .mem-head{margin-bottom:8px; display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .mem-head h2{font-size:30px; color:var(--coral);}
  .mem-status{font-family:'Quicksand'; font-weight:700; font-size:13px; color:var(--ink-soft);}
  .mem-restart{
    font-family:'Quicksand'; font-weight:700; font-size:12px;
    border:2px solid var(--ink); background:var(--paper); color:var(--ink);
    border-radius:999px; padding:4px 12px; cursor:pointer;
  }
  .mem-grid{
    flex:1; display:grid; grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(3,1fr);
    gap:9px; align-content:stretch;
  }
  .mem-card{ perspective:600px; cursor:pointer; }
  .mem-inner{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d; transition:transform .45s cubic-bezier(.4,.2,.2,1);
  }
  .mem-card.flipped .mem-inner, .mem-card.matched .mem-inner{ transform:rotateY(180deg); }
  .mem-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:12px; border:2.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:4px;
  }
  .mem-back{
    background:repeating-linear-gradient(45deg, var(--violet), var(--violet) 6px, #7a6bd0 6px, #7a6bd0 12px);
  }
  .mem-back::after{content:"?"; font-family:'Caveat'; font-size:30px; color:#fff;}
  .mem-front{
    background:var(--paper); transform:rotateY(180deg);
    flex-direction:column; gap:2px;
  }
  .mem-front svg{width:70%; height:70%;}
  .mem-front .mem-word{font-family:'Quicksand'; font-weight:700; font-size:11px; text-align:center;}
  .mem-card.matched .mem-front{background:#D6F2ED;}
  .mem-win{
    position:absolute; inset:0; background:rgba(255,253,246,.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .mem-win.show{opacity:1; pointer-events:auto;}
  .mem-win h3{font-size:40px; color:var(--coral);}

  @media (max-width:720px){
    .mem-grid{grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr);}
    .mem-front .mem-word{font-size:9px;}
  }

  /* ---------- nav ---------- */
  .nav{
    position:absolute;
    bottom:env(safe-area-inset-bottom,14px);
    left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:14px;
    z-index:5;
  }
  .nbtn{
    width:38px; height:38px; border-radius:50%;
    border:2.5px solid var(--ink); background:var(--paper);
    color:var(--ink); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:2px 3px 0 rgba(0,0,0,.15);
  }
  .nbtn:active{transform:translateY(2px); box-shadow:none;}
  .dots{display:flex; gap:5px; flex-wrap:wrap; max-width:340px; justify-content:center;}
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--ink-soft); opacity:.35; cursor:pointer;
  }
  .dot.on{opacity:1; background:var(--coral); transform:scale(1.3);}
  .counter{
    position:absolute; top:12px; right:20px;
    font-family:'Quicksand'; font-weight:700; font-size:12px; color:var(--ink-soft);
  }

  @media (max-width:720px){
    .vocab-grid{grid-template-columns:repeat(2,1fr);}
    .quiz-grid{grid-template-columns:repeat(2,1fr);}
    .bubble{max-width:88%; font-size:14px;}
    .sheet{height:94vh;}
  }
</style>
</head>

<div class="app">
  <div class="sheet" id="sheet">
    <div class="spiral">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="margin-line"></div>
    <div class="page" id="page"></div>
    <div class="counter" id="counter"></div>
    <div class="nav">
      <button class="nbtn" id="prevBtn" aria-label="Anterior">‹</button>
      <div class="dots" id="dots"></div>
      <button class="nbtn" id="nextBtn" aria-label="Siguiente">›</button>
    </div>
  </div>
</div>

<script>
/* ============ DATA ============ */
const vocab = [
  {w:"la mochila", art:"la", icon:"i-mochila", color:"#F08FA2"},
  {w:"el estuche", art:"el", icon:"i-estuche", color:"#3FBFAE"},
  {w:"el lápiz", art:"el", icon:"i-lapiz", color:"#3FBFAE"},
  {w:"el bolígrafo", art:"el", icon:"i-boligrafo", color:"#3FBFAE"},
  {w:"la goma", art:"la", icon:"i-goma", color:"#F08FA2"},
  {w:"el sacapuntas", art:"el", icon:"i-sacapuntas", color:"#3FBFAE"},
  {w:"el cuaderno", art:"el", icon:"i-cuaderno", color:"#3FBFAE"},
  {w:"el libro", art:"el", icon:"i-libro", color:"#3FBFAE"},
  {w:"la regla", art:"la", icon:"i-regla", color:"#F08FA2"},
  {w:"las tijeras", art:"las", icon:"i-tijeras", color:"#8B79E8"},
  {w:"el pegamento", art:"el", icon:"i-pegamento", color:"#3FBFAE"},
  {w:"los rotuladores", art:"los", icon:"i-rotuladores", color:"#3C9EE8"},
  {w:"la pizarra", art:"la", icon:"i-pizarra", color:"#F08FA2"},
  {w:"la tiza", art:"la", icon:"i-tiza", color:"#F08FA2"},
  {w:"el borrador", art:"el", icon:"i-borrador", color:"#3FBFAE"},
  {w:"la mesa", art:"la", icon:"i-mesa", color:"#F08FA2"},
  {w:"la silla", art:"la", icon:"i-silla", color:"#F08FA2"},
  {w:"la puerta", art:"la", icon:"i-puerta", color:"#F08FA2"},
  {w:"la ventana", art:"la", icon:"i-ventana", color:"#F08FA2"},
  {w:"el ordenador", art:"el", icon:"i-ordenador", color:"#3FBFAE"},
];

const qa = [
  {q:"¿Cómo te llamas?", a:"Me llamo Sofía.", who:"la profe / el alumno"},
  {q:"¿Cómo estás hoy?", a:"Muy bien, ¡gracias!", who:"la profe / el alumno"},
  {q:"¿Qué es esto?", a:"Es una mochila.", who:"la profe / el alumno"},
  {q:"¿Cómo se dice \"quaderno\" en español?", a:"Se dice \"cuaderno\".", who:"el alumno / la profe"},
  {q:"¿Cómo se escribe \"tijeras\"?", a:"Se escribe T-I-J-E-R-A-S.", who:"el alumno / la profe"},
  {q:"¿Puedo ir al baño?", a:"Sí, puedes. Vuelve pronto.", who:"el alumno / la profe"},
  {q:"¿Tienes un lápiz de más?", a:"Sí, toma. / No, lo siento.", who:"el alumno / el compañero"},
  {q:"¿Puedes repetir, por favor?", a:"Claro, te lo repito.", who:"el alumno / la profe"},
  {q:"Perdón, no entiendo.", a:"Vale, te lo explico otra vez.", who:"el alumno / la profe"},
  {q:"¿En qué página estamos?", a:"Estamos en la página 25.", who:"el alumno / la profe"},
];

/* ============ BUILD SLIDES ============ */
const page = document.getElementById('page');
const slides = [];

function el(html){ const d=document.createElement('div'); d.className='slide'; d.innerHTML=html; return d; }

// 1. Title
slides.push(el(`
  <div class="title-slide">
    <div class="eyebrow">1º ESO · Español</div>
    <h1>¡Bienvenidos a la<br>clase de español!</h1>
    <p class="sub">Hoy aprendemos las palabras del aula y las frases que usamos<br>todos los días en clase. ¡Vamos a jugar con las palabras!</p>
    <div class="badge-row">
      <span class="badge" style="background:#FF6B4A">objetos del aula</span>
      <span class="badge" style="background:#3C9EE8; transform:rotate(2deg)">preguntas y respuestas</span>
    </div>
  </div>
  <svg class="title-doodle"><use href="#i-carita-feliz"/></svg>
`));

// 2. Divider: objetos
slides.push(el(`
  <div class="divider">
    <div class="num">Parte 1</div>
    <h2>Los objetos del aula</h2>
    <div class="underline"></div>
    <svg class="doodle-big"><use href="#i-mochila"/></svg>
    <p>20 palabras para no olvidar nunca el estuche en casa</p>
  </div>
`));

// 3-7 vocab grids (4 per slide)
for(let i=0;i<vocab.length;i+=4){
  const chunk = vocab.slice(i,i+4);
  slides.push(el(`
    <div class="vocab-head"><h2>¿Qué hay en tu mochila?</h2></div>
    <div class="vocab-grid">
      ${chunk.map(v=>`
        <div class="vcard">
          <button class="speak-btn" data-speak='${v.w}' aria-label="Escuchar">🔊</button>
          <svg><use href="#${v.icon}"/></svg>
          <div class="word">${v.w}</div>
          <span class="art" style="background:${v.color}">${v.art}</span>
        </div>
      `).join('')}
    </div>
  `));
}

// Memory game
slides.push(el(`
  <div class="mem-head">
    <h2>¡A jugar! Memory</h2>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="mem-status" id="memStatus">0 / 8 parejas</span>
      <button class="mem-restart" id="memRestart">🔄 Reiniciar</button>
    </div>
  </div>
  <div class="mem-grid" id="memGrid"></div>
  <div class="mem-win" id="memWin">
    <svg style="width:90px;height:90px"><use href="#i-carita-feliz"/></svg>
    <h3>¡Lo lograste!</h3>
    <p>Encontraste las 8 parejas. ¡Eres una máquina del español!</p>
  </div>
`));

// Divider: preguntas
slides.push(el(`
  <div class="divider">
    <div class="num">Parte 2</div>
    <h2>Preguntas y respuestas de clase</h2>
    <div class="underline" style="background:#3C9EE8"></div>
    <svg class="doodle-big"><use href="#i-bocadillo"/></svg>
    <p>Las frases mágicas para sobrevivir a una clase de español</p>
  </div>
`));

// QA slides (2 per slide)
for(let i=0;i<qa.length;i+=2){
  const chunk = qa.slice(i,i+2);
  slides.push(el(`
    <div class="qa-head"><h2>Escucha y responde</h2></div>
    <div class="qa-wrap">
      ${chunk.map(p=>`
        <div class="qa-pair">
          <div class="bubble q"><span class="bubble-row"><span>${p.q}</span><button class="speak-btn" data-speak='${p.q}' aria-label="Escuchar">🔊</button></span></div>
          <div class="bubble a"><span class="bubble-row"><span>${p.a}</span><button class="speak-btn" data-speak='${p.a}' aria-label="Escuchar">🔊</button></span></div>
        </div>
      `).join('')}
    </div>
  `));
}

// Quiz slide
slides.push(el(`
  <div class="vocab-head"><h2>¡A repasar! ¿Qué es esto?</h2></div>
  <div class="quiz-grid">
    <div class="qcard"><svg><use href="#i-tijeras"/></svg><div class="ask">¿…?</div></div>
    <div class="qcard"><svg><use href="#i-pizarra"/></svg><div class="ask">¿…?</div></div>
    <div class="qcard"><svg><use href="#i-libro"/></svg><div class="ask">¿…?</div></div>
    <div class="qcard"><svg><use href="#i-sacapuntas"/></svg><div class="ask">¿…?</div></div>
    <div class="qcard"><svg><use href="#i-silla"/></svg><div class="ask">¿…?</div></div>
    <div class="qcard"><svg><use href="#i-ventana"/></svg><div class="ask">¿…?</div></div>
  </div>
`));

// Closing
slides.push(el(`
  <div class="end-slide">
    <svg class="doodle-big" style="width:130px;height:130px"><use href="#i-puerta-ok"/></svg>
    <h1>¡Muy bien, clase!</h1>
    <p class="sub">Ya conoces los objetos del aula y sabes preguntar y responder<br>en español. Practica en casa: ¡nos vemos en la próxima lección!</p>
  </div>
`));

slides.forEach(s=>page.appendChild(s));

/* ============ NAV LOGIC ============ */
let current = 0;
const dotsWrap = document.getElementById('dots');
const counter = document.getElementById('counter');

slides.forEach((_,i)=>{
  const d = document.createElement('div');
  d.className = 'dot';
  d.addEventListener('click', ()=>go(i));
  dotsWrap.appendChild(d);
});

function render(){
  slides.forEach((s,i)=> s.classList.toggle('active', i===current));
  [...dotsWrap.children].forEach((d,i)=> d.classList.toggle('on', i===current));
  counter.textContent = (current+1) + ' / ' + slides.length;
}
function go(i){
  current = Math.max(0, Math.min(slides.length-1, i));
  render();
}
document.getElementById('prevBtn').addEventListener('click', ()=>go(current-1));
document.getElementById('nextBtn').addEventListener('click', ()=>go(current+1));
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') go(current+1);
  if(e.key==='ArrowLeft') go(current-1);
});

let touchX=null;
const sheet = document.getElementById('sheet');
sheet.addEventListener('touchstart', e=> touchX = e.touches[0].clientX);
sheet.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(dx>50) go(current-1);
  if(dx<-50) go(current+1);
  touchX=null;
});

/* ============ AUDIO (TTS) ============ */
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const clean = text.replace(/[¿?¡!]/g,'').trim();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'es-ES';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(err){ /* speech synthesis unavailable, fail silently */ }
}
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.speak-btn');
  if(!btn) return;
  e.stopPropagation();
  speak(btn.dataset.speak || '');
});

/* ============ MEMORY GAME ============ */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function buildMemoryDeck(){
  const picks = ["la mochila","el lápiz","las tijeras","la pizarra","el libro","la silla","la ventana","el ordenador"];
  const source = vocab.filter(v=> picks.includes(v.w));
  const deck = [];
  source.forEach((v,i)=>{
    deck.push({pair:i, type:'icon', icon:v.icon, word:v.w});
    deck.push({pair:i, type:'word', icon:v.icon, word:v.w});
  });
  return shuffle(deck);
}
let memState = { deck:[], flipped:[], matched:0, lock:false };

function renderMemory(){
  const grid = document.getElementById('memGrid');
  if(!grid) return;
  grid.innerHTML = '';
  memState.deck.forEach((c,idx)=>{
    const card = document.createElement('div');
    card.className = 'mem-card';
    card.dataset.idx = idx;
    card.innerHTML = `
      <div class="mem-inner">
        <div class="mem-face mem-back"></div>
        <div class="mem-face mem-front">
          ${c.type==='icon' ? `<svg><use href="#${c.icon}"/></svg>` : `<div class="mem-word">${c.word}</div>`}
        </div>
      </div>`;
    card.addEventListener('click', ()=>flipCard(idx));
    grid.appendChild(card);
  });
  updateMemStatus();
}
function updateMemStatus(){
  const s = document.getElementById('memStatus');
  if(s) s.textContent = memState.matched + ' / ' + (memState.deck.length/2) + ' parejas';
}
function flipCard(idx){
  if(memState.lock) return;
  const cardEl = document.querySelector('.mem-card[data-idx="'+idx+'"]');
  if(!cardEl || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
  cardEl.classList.add('flipped');
  memState.flipped.push(idx);
  if(memState.flipped.length === 2){
    memState.lock = true;
    const [a,b] = memState.flipped;
    const same = memState.deck[a].pair === memState.deck[b].pair;
    if(same){
      setTimeout(()=>{
        document.querySelector('.mem-card[data-idx="'+a+'"]').classList.add('matched');
        document.querySelector('.mem-card[data-idx="'+b+'"]').classList.add('matched');
        memState.matched++;
        memState.flipped = [];
        memState.lock = false;
        updateMemStatus();
        if(memState.matched === memState.deck.length/2){
          const win = document.getElementById('memWin');
          if(win) win.classList.add('show');
        }
      }, 500);
    } else {
      setTimeout(()=>{
        const elA = document.querySelector('.mem-card[data-idx="'+a+'"]');
        const elB = document.querySelector('.mem-card[data-idx="'+b+'"]');
        if(elA) elA.classList.remove('flipped');
        if(elB) elB.classList.remove('flipped');
        memState.flipped = [];
        memState.lock = false;
      }, 900);
    }
  }
}
function restartMemory(){
  memState = { deck: buildMemoryDeck(), flipped:[], matched:0, lock:false };
  const win = document.getElementById('memWin');
  if(win) win.classList.remove('show');
  renderMemory();
}
const restartBtn = document.getElementById('memRestart');
if(restartBtn) restartBtn.addEventListener('click', restartMemory);
restartMemory();

render();
</script>
